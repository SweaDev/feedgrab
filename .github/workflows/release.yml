name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.check.outputs.release }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Moving old tags (e.g. after re-signing history) must not rebuild old releases:
      # only the newest v* tag without a GitHub release yet goes on.
      - name: Release only the newest tag without a release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          newest=$(git tag -l 'v*' --sort=-v:refname | head -1)
          if [ "$GITHUB_REF_NAME" != "$newest" ]; then
            echo "::notice::$GITHUB_REF_NAME is not the newest tag ($newest); skipping"
            echo "release=false" >> "$GITHUB_OUTPUT"
          elif gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "::notice::$GITHUB_REF_NAME already has a release; skipping"
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  main-only:
    needs: gate
    if: needs.gate.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Only release commits on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD; then
            echo "Tag $GITHUB_REF_NAME points at a commit that is not on main; releases build only from main."
            exit 1
          fi

  ci:
    needs: main-only
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Check tag matches package.json version
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Check bundle size and encoding
        run: bun run scripts/check-size.ts

      - name: Pack
        run: npm pack

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" feedgrab-*.tgz --title "$GITHUB_REF_NAME" --generate-notes
